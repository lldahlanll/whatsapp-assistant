services:
  app:
    image: whatsapp-platform:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-platform
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${API_PORT:-8077}:8077"
    volumes:
      # SQLite databases + WhatsApp session file (stored as /app/storage/<session>.db)
      - app_storage:/app/storage
      # Logs
      - app_logs:/app/logs
    networks:
      - wa_net

volumes:
  app_storage:
  app_logs:

networks:
  wa_net:
    driver: bridge
